[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mecha"
version = "0.1.0"
description = "A safety-first Coding Agent Harness — LLM-powered coding with code-level guardrails"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "keyring>=24.0.0",
    "pyyaml>=6.0",
    "pytest>=7.0.0",
]

[project.scripts]
mecha = "mecha.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]