[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mecha*"]

[project]
name = "mecha"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "keyring>=24.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
mecha = "mecha.cli:main"
mecha-server = "mecha.server:run_server"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
